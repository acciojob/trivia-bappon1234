<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	 <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            color: #333;
        }

        .quiz-container {
            margin-bottom: 25px;
        }

        .options-container {
            margin-top: 10px;
        }

        .option-item {
            margin-bottom: 8px;
        }

        blockquote {
            max-width: 600px;
            margin: 10px;
            padding: 15px;
            border-left: 8px solid green;
            background-color: #f8fffe;
            font-weight: bold;
        }
    </style>
</head>

<body>
	<!-- the entire body must be written by student -->
	<div class="quiz-container">
		<p><strong>Question:</strong>What is the captial of India?</p>
		<div class="options-container">
            <div class="option-item">
                <input type="radio" id="delhi" name="capital_quiz" value="New Delhi">
                <label for="delhi">New Delhi</label>
            </div>
            <div class="option-item">
                <input type="radio" id="mumbai" name="capital_quiz" value="Mumbai">
                <label for="mumbai">Mumbai</label>
            </div>
		</div>
	</div>

	<blockquote cite="https://wikipedia.org">
        "New Delhi is the capital of India and an administrative district of NCT Delhi."
    </blockquote>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
